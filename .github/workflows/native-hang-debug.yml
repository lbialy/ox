name: native-hang-debug
# Lives only on the native-hang-debug branch of the fork. bin/ci-run commits
# .github/hang-debug/variant.env and pushes; each push runs one variant with
# RUNS parallel legs. Each leg is one run in results.jsonl.
on:
  push:
    branches: [ native-hang-debug ]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.v.outputs.legs }}
      runner: ${{ steps.v.outputs.runner }}
      java: ${{ steps.v.outputs.java }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v() { grep -E "^$1=" .github/hang-debug/variant.env | tail -1 | cut -d= -f2- || true; }
          n=$(v RUNS); echo "legs=$(seq 1 "${n:-5}" | jq -sc .)" >> "$GITHUB_OUTPUT"
          r=$(v RUNNER); j=$(v JAVA)
          echo "runner=${r:-ubuntu-24.04}" >> "$GITHUB_OUTPUT"
          echo "java=${j:-21}" >> "$GITHUB_OUTPUT"
  run:
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.setup.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.setup.outputs.java }}
          cache: sbt
      - uses: sbt/setup-sbt@3e125ece5c3e5248e18da9ed8d2cce3d335ec8dd # v1.1.14
      - name: Debug tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb strace zstd stress-ng linux-tools-common "linux-tools-$(uname -r)" >/dev/null || true
          sudo sysctl -w kernel.yama.ptrace_scope=0 kernel.perf_event_paranoid=1
          echo "nproc=$(nproc)"; lscpu | head -20
      - name: Variant
        run: |
          cat .github/hang-debug/variant.env
          grep -v '^\s*#' .github/hang-debug/variant.env | grep . >> "$GITHUB_ENV"
      - name: Native config
        run: |
          s=""
          [ -n "${GC:-}" ] && s="$s.withGC(scala.scalanative.build.GC.$GC)"
          [ -n "${NATIVE_MODE:-}" ] && s="$s.withMode(scala.scalanative.build.Mode.$NATIVE_MODE)"
          [ -n "$s" ] && echo "SBT_SET=set LocalProject(\"coreNative3\") / nativeConfig ~= (_$s)" >> "$GITHUB_ENV" || true
      - name: Compile
        # Same as ci.yml. In native-only mode, also link the test binary here so it is not timed.
        run: |
          set -- ; [ -n "${SBT_SET:-}" ] && set -- "$SBT_SET"
          sbt -v "$@" compile
          if [ "${SCOPE:-native}" = native ]; then sbt -v "$@" coreNative3/Test/nativeLink; fi
      - name: Test under watchdog
        timeout-minutes: 60
        run: |
          ulimit -c unlimited
          if [ "${SCOPE:-native}" = native ]; then cmd="${TEST_CMD:-coreNative3/test}"; else cmd="${TEST_CMD:-test}"; fi
          LOAD_PID=
          if [ "${LOAD:-0}" -gt 0 ]; then stress-ng -q -c "$LOAD" & LOAD_PID=$!; fi
          set -- ; [ -n "${SBT_SET:-}" ] && set -- "$SBT_SET"
          bash .github/hang-debug/watchdog.sh out -- sbt -v "$@" "$cmd"
          [ -n "$LOAD_PID" ] && kill $LOAD_PID || true
          find . -path ./out -prune -o -path '*/test-reports/TEST*.xml' -print | xargs -r cp -t out/ 2>/dev/null || true
          # symbols for the dump
          if [ -d out/dumps/native ]; then find . -path '*/target/*' -name '*-test-out' -newer build.sbt -exec cp -t out/dumps/native {} + 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leg-${{ matrix.leg }}
          path: out/
          retention-days: 14
